version: "3.9"

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: medpoint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"          # host 5433 avoids conflict with any local postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # ↑ Postgres runs any .sql in initdb.d on FIRST startup only (empty volume).
      #   Re-running requires: docker-compose down -v  (destroys the named volume)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medpoint_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Zookeeper ───────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: medpoint_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    ports:
      - "2181:2181"
    healthcheck:
      # "ruok" (are you ok?) is Zookeeper's built-in health probe — responds "imok"
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka ───────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: medpoint_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy   # wait for Zookeeper before Kafka starts
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: PLAINTEXT for internal Docker traffic (port 29092),
      # PLAINTEXT_HOST for connections from the host machine (port 9092)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      # Asks the broker for its API versions — fails until Kafka is truly ready
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 8      # Kafka takes longer to boot than Postgres or Redis

  # ─── FastAPI — instance 1 ────────────────────────────────────────────────
  fastapi-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medpoint_fastapi_1
    restart: unless-stopped
    # Phase 4 target: replace with real app entry point when api/main.py exists
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file: .env             # loads PYTHONPATH + all infra vars from .env
    environment:
      # These override anything in .env with Docker-network-correct values
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - .:/app                 # live reload — source changes reflect without rebuild
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── FastAPI — instance 2 ────────────────────────────────────────────────
  fastapi-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medpoint_fastapi_2
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── Nginx (load balancer) ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: medpoint_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Fixed path: nginx.conf lives in nginx/ subfolder per project structure
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi-1
      - fastapi-2
      # No condition: service_healthy here — Nginx itself doesn't expose a
      # healthcheck endpoint we can probe before the FastAPI apps are up.
      # The FastAPI depends_on already guarantees infra is ready before Nginx starts.

  # ─── Worker services (Phase 5 target) ───────────────────────────────────
  # Uncomment and extend when workers are implemented in Phase 5.
  # All workers share the same image — only `command` differs per worker type.
  #
  # worker-npi:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: medpoint_worker_npi
  #   restart: unless-stopped
  #   command: python -m workers.npi_fetcher
  #   env_file: .env
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: 5432
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #
  # worker-dca:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: medpoint_worker_dca
  #   restart: unless-stopped
  #   command: python -m workers.dca_reader
  #   env_file: .env
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: 5432
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #
  # worker-notification:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: medpoint_worker_notification
  #   restart: unless-stopped
  #   command: python -m workers.notification_worker
  #   env_file: .env
  #   environment:
  #     POSTGRES_HOST: postgres
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #     REDIS_HOST: redis
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
    # Named volume — data persists across docker-compose down.
    # To wipe and re-seed: docker-compose down -v